[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Production RAG pipeline (parsing, vector store, reranker, cited generation) on LangGraph with AWS and Azure adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
aws = ["boto3>=1.40", "opensearch-py>=2.6"]
azure = [
  "azure-identity>=1.17",
  "azure-search-documents>=11.6",
  "azure-ai-documentintelligence>=1.0",
  "azure-storage-blob>=12.20",
  "openai>=1.40",
]
local-models = ["sentence-transformers>=3.0", "docling>=2.0"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "boto3>=1.40", "opensearch-py>=2.6"]
all = ["claimlens[aws,azure,openai,dev]"]

[project.scripts]
claimlens = "claimlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
